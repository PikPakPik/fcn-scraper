name: 📅 Scrape FC Nantes Calendar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  scrape-calendar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Version lue depuis "packageManager" dans package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # pnpm 10 bloque le postinstall de Puppeteer, on installe Chrome à la main
      - run: pnpm exec puppeteer browsers install chrome

      - name: 🏈 Scrape FC Nantes calendar
        run: pnpm run scrape

      - name: 📝 Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add calendrier-fcnantes.ics
          # DTSTAMP change à chaque run : on ne commit que si un match a changé
          if git diff --staged --quiet -I '^DTSTAMP:'; then
            echo "📋 Aucun changement dans le calendrier"
          else
            git commit -m "🏈 Mise à jour automatique du calendrier FC Nantes - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
